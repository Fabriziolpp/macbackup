<!--
  FONTS — Le classi in styles.css consumano due CSS variables:
    --font-barlow            (body / meta / card)
    --font-barlow-condensed  (heading / label / numeri hero / tag)

  Nell'app reale i font sono caricati via next/font (app/layout.tsx) con i pesi:
    Barlow            400, 500, 600  +  italic 400
    Barlow Condensed  400, 500, 600, 700, 800, 900

  Per un prototipo standalone (es. su Claude Design) includere questi tag:
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Barlow+Condensed:wght@400;500;600;700;800;900&display=swap"
  rel="stylesheet"
>
