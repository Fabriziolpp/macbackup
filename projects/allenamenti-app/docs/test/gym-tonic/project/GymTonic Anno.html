// ─── YEAR STRIP ──────────────────────────────────────────────
function YearStrip({ accent }) {
  const maxMin = Math.max(...MONTHS.map(m=>m.min));
  return (
    <div>
      <div style={{ display:"grid", gridTemplateColumns:"repeat(12,1fr)", gap:4 }}>
        {MONTHS.map((m,i) => {
          const intensity = maxMin > 0 ? m.min / maxMin : 0;
          const active = m.all > 0;
          const isCurrent = i === 3; // April
          return (
            <div key={m.key} style={{ display:"flex", flexDirection:"column", gap:6 }}>
              <div style={{ height:56, borderRadius:4, background: active ? `${accent}${Math.round(0.15+intensity*0.75).toFixed(2).slice(1)}` : "rgba(255,255,255,0.05)", border: isCurrent ? `1.5px solid ${accent}` : active ? `1px solid ${accent}44` : "1px solid rgba(255,255,255,0.06)", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:4, transition:"transform 0.15s", cursor: active ? "default" : "default" }}>
                {active && <>
                  <div style={{ fontFamily:"'Barlow Condensed', sans-serif", fontSize:14, fontWeight:800, color:accent, lineHeight:1 }}>{m.all}</div>
                  <div style={{ fontFamily:"'Barlow Condensed', sans-serif", fontSize:9, fontWeight:600, color:"rgba(255,255,255,0.4)" }}>{Math.round(m.min/60)}h</div>
                </>}
              </div>
              <div style={{ fontFamily:"'Barlow Condensed', sans-serif", fontSize:10, fontWeight:700, letterSpacing:0.5, color: active ? accent : "rgba(255,255,255,0.25)", textAlign:"center", textTransform:"uppercase" }}>{m.label}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── MONTHLY PROGRESS CHART ──────────────────────────────────
function MonthlyChart({ t, accent }) {
  const [mode, setMode] = React.useState("min");
  const [hoveredIdx, setHoveredIdx] = React.useState(null);
  const vals  = MONTHS.map(m => mode === "min" ? m.min : m.all);
  const maxV  = Math.max(...vals, 1);
  const chartH = 120;

  return (
    <div style={{ padding:"28px 28px 8px", animation:"fadeUp 0.4s ease 0.1s both" }}>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:20 }}>
        <div style={{ fontFamily:"'Barlow Condensed', sans-serif", fontWeight:800, fontSize:28, letterSpacing:-0.5, color:t.textPrimary }}>PROGRESSI MENSILI</div>
        <div style={{ display:"flex", background:t.inputBg, borderRadius:4, overflow:"hidden", border:`1px solid ${t.border}` }}>
          {["min","sessioni"].map(m => (
            <button key={m} onClick={() => setMode(m)} style={{ padding:"6px 14px", border:"none", cursor:"pointer", fontFamily:"'Barlow Condensed', sans-serif", fontSize:11, fontWeight:700, letterSpacing:1.5, textTransform:"uppercase", background: mode===m ? accent : "transparent", color: mode===m ? "#0D0D0D" : t.textMuted, transition:"all 0.15s" }}>{m}</button>
          ))}
        </div>
      </div>

      <div style={{ display:"flex", alignItems:"flex-end", gap:6, height:chartH+40 }}>
        {MONTHS.map((m, i) => {
          const val = vals[i];
          const pct = val / maxV;
          const barH = Math.max(pct * chartH, val > 0 ? 4 : 0);
          const isHover = hoveredIdx === i;
          return (
            <div key={m.key} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:4, height:"100%", justifyContent:"flex-end" }}
              onMouseEnter={() => val > 0 && setHoveredIdx(i)}
              onMouseLeave={() => setHoveredIdx(null)}>
              {isHover && val > 0 && (
                <div style={{ fontFamily:"'Barlow Condensed', sans-serif", fontSize:12, fontWeight:700, color:accent, marginBottom:2 }}>{val}{mode==="min" ? "′" : ""}</div>
              )}
              <div style={{ width:"100%", flex:1, display:"flex", alignItems:"flex-end" }}>
                <div style={{ width:"100%", height:`${barH}px`, background: val>0 ? (isHover ? accent : `${accent}CC`) : t.inputBg, borderRadius:"3px 3px 0 0", transition:"all 0.2s", transformOrigin:"bottom", animation: val>0 ? `barGrow 0.5s ease ${i*0.04}s both` : "none", opacity: val > 0 ? 1 : 0.3 }}/>
              </div>
              <div style={{ fontFamily:"'Barlow Condensed', sans-serif", fontSize:10, fontWeight:600, letterSpacing:0.3, color: val>0 ? t.textSecondary : t.textMuted, textTransform:"uppercase" }}>{m.label}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── MONTHLY SUMMARY ─────────────────────────────────────────

  const active = MONTHS.map((m,i) => ({...m, idx:i})).filter(m=>m.all>0).reverse();
  return (
    <div style={{ padding:"24px 28px 8px", animation:"fadeUp 0.4s ease 0.15s both" }}>
      <div style={{ fontFamily:"'Barlow Condensed', sans-serif", fontWeight:800, fontSize:28, letterSpacing:-0.5, color:t.textPrimary, marginBottom:14 }}>RIEPILOGO MENSILE</div>
      <div style={{ display:"flex", flexDirection:"column" }}>
        {active.map((m, i) => (
          <div key={m.key} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"14px 0", borderBottom: i < active.length-1 ? `1px solid ${t.border}` : "none", animation:`fadeUp 0.35s ease ${i*0.05}s both` }}>
            <div style={{ display:"flex", alignItems:"center", gap:12 }}>
              <div style={{ width:4, height:32, borderRadius:2, background:accent, opacity: 0.5 + (m.idx/11)*0.5 }}/>
              <div>
                <div style={{ fontFamily:"'Barlow Condensed', sans-serif", fontWeight:700, fontSize:16, letterSpacing:0.5, color:t.textPrimary, textTransform:"uppercase" }}>{MONTH_LABELS_FULL[m.idx+1]}</div>
              </div>
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:24 }}>
              <div style={{ textAlign:"right" }}>
                <div style={{ fontFamily:"'Barlow Condensed', sans-serif", fontWeight:800, fontSize:22, color:t.textPrimary, letterSpacing:-0.5 }}>{m.all}</div>
                <div style={{ fontFamily:"'Barlow Condensed', sans-serif", fontSize:10, fontWeight:600, letterSpacing:1.5, color:t.textMuted, textTransform:"uppercase" }}>all.</div>
              </div>
              <div style={{ textAlign:"right", minWidth:72 }}>
                <div style={{ fontFamily:"'Barlow Condensed', sans-serif", fontWeight:800, fontSize:22, color:accent, letterSpacing:-0.5 }}>{m.min}</div>
                <div style={{ fontFamily:"'Barlow Condensed', sans-serif", fontSize:10, fontWeight:600, letterSpacing:1.5, color:t.textMuted, textTransform:"uppercase" }}>min</div>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );

// ─── WORKOUT CARD ────────────────────────────────────────────
function WorkoutCard({ w, t, accent, onDelete, idx }) {
  const [hover, setHover] = React.useState(false);
  const tagBg    = w.month==="APR" ? t.tagAprileBg : w.month==="MAR" ? t.tagMarzo : "rgba(59,232,255,0.12)";
  const tagColor = w.month==="APR" ? t.tagAprileColor : w.month==="MAR" ? t.tagMarzoColor : "#007a8a";
  return (
    <div onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}

      <div style={{ width:4, flexShrink:0, background:w.color }}/>
      <div style={{ flex:1, padding:"13px 18px", minWidth:0 }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:8 }}>
          <div style={{ display:"flex", alignItems:"center", gap:8 }}>
            <div style={{ background:tagBg, color:tagColor, fontFamily:"'Barlow Condensed', sans-serif", fontSize:10, fontWeight:700, letterSpacing:1.5, padding:"3px 8px", borderRadius:3, textTransform:"uppercase" }}>{w.scheda}</div>
            <span style={{ fontFamily:"'Barlow Condensed', sans-serif", fontWeight:700, fontSize:15, letterSpacing:0.5, color:t.textPrimary, textTransform:"uppercase" }}>{w.giorno}</span>
          </div>
          <div style={{ fontFamily:"'Barlow Condensed', sans-serif", fontSize:12, fontWeight:700, color:t.textMuted, background:t.inputBg, padding:"3px 10px", borderRadius:3 }}>{w.durata} min</div>
        </div>
        <div style={{ fontFamily:"'Barlow', sans-serif", fontSize:12, color:t.textSecondary, marginBottom: w.note ? 7 : 0 }}>{w.data} · {w.ora}</div>
        {w.note && <div style={{ fontFamily:"'Barlow', sans-serif", fontSize:12, color:t.textPrimary, fontStyle:"italic", lineHeight:1.5, paddingTop:5, borderTop:`1px solid ${t.border}` }}>"{w.note}"</div>}
      </div>
      <div style={{ flexShrink:0, display:"flex", flexDirection:"column", justifyContent:"center", gap:4, padding:"0 14px", borderLeft:`1px solid ${t.border}`, opacity: hover ? 1 : 0, transition:"opacity 0.15s" }}>
        <button style={{ background:"none", border:"none", cursor:"pointer", color:t.textSecondary, padding:6, borderRadius:4, display:"flex" }}>
          <svg width="14" height="14" viewBox="0 0 15 15" fill="none"><path d="M10.5 1.5l3 3M2 13l1-4L11.5 1l3 3L6 13H2z" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/></svg>
        </button>
        <button onClick={onDelete} style={{ background:"none", border:"none", cursor:"pointer", color:"#FF5555", padding:6, borderRadius:4, display:"flex" }}>
          <svg width="14" height="14" viewBox="0 0 15 15" fill="none"><path d="M3 4h9M6 4V2h3v2M5 4l.5 8M10 4l-.5 8" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/></svg>
        </button>
      </div>
    </div>
  );
}

// ─── WORKOUT LIST ────────────────────────────────────────────
function WorkoutList({ t, accent }) {
  const [deleted, setDeleted] = React.useState([]);
  const visible = ALL_WORKOUTS.filter(w => !deleted.includes(w.id));
  return (
    <div style={{ padding:"24px 28px 48px", animation:"fadeUp 0.4s ease 0.2s both" }}>
      <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", marginBottom:20 }}>
        <div style={{ fontFamily:"'Barlow Condensed', sans-serif", fontWeight:800, fontSize:36, letterSpacing:-1, color:t.textPrimary }}>ALLENAMENTI</div>
        <div style={{ fontFamily:"'Barlow Condensed', sans-serif", fontSize:12, fontWeight:600, letterSpacing:1.5, color:t.textMuted, textTransform:"uppercase" }}>{visible.length} totali</div>
      </div>
      <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
        {visible.map((w,i) => <WorkoutCard key={w.id} w={w} t={t} accent={accent} onDelete={() => setDeleted(d=>[...d,w.id])} idx={i}/>)}
      </div>
    </div>
  );
}

// ─── TWEAKS ──────────────────────────────────────────────────
function TweaksPanel({ tweaks, setTweaks, visible }) {
  if (!visible) return null;
  const btn = { fontFamily:"'Barlow Condensed', sans-serif", fontSize:13, fontWeight:600, padding:"8px 14px", border:"1.5px solid #ddd", borderRadius:4, cursor:"pointer", background:"#fff", color:"#333", transition:"all 0.15s", textAlign:"left" };
  return (
    <div style={{ position:"fixed", bottom:24, right:24, zIndex:100, background:"#fff", border:"1px solid rgba(0,0,0,0.12)", borderRadius:8, padding:"18px 20px", boxShadow:"0 8px 32px rgba(0,0,0,0.15)", width:240 }}>
      <div style={{ fontFamily:"'Barlow Condensed', sans-serif", fontWeight:700, fontSize:14, letterSpacing:1, textTransform:"uppercase", color:"#333", marginBottom:14 }}>Tweaks</div>
      <div style={{ marginBottom:14 }}>
        <div style={{ fontSize:11, fontWeight:600, letterSpacing:1, color:"#999", textTransform:"uppercase", marginBottom:8, fontFamily:"'Barlow Condensed', sans-serif" }}>Tema</div>
        <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
          {[["dark","Dark Athletic"],["light","Light Editorial"],["split","Split Contrast"]].map(([key,name]) => (
            <button key={key} onClick={() => setTweaks(t=>({...t,theme:key}))} style={{ ...btn, background: tweaks.theme===key ? "#0D0D0D" : "#fff", color: tweaks.theme===key ? "#fff" : "#333", borderColor: tweaks.theme===key ? "#0D0D0D" : "#ddd" }}>{name}</button>
          ))}
        </div>
      </div>
      <div>
        <div style={{ fontSize:11, fontWeight:600, letterSpacing:1, color:"#999", textTransform:"uppercase", marginBottom:8, fontFamily:"'Barlow Condensed', sans-serif" }}>Accent</div>
        <div style={{ display:"flex", gap:8 }}>
          {["#C8F135","#FF3B6B","#FF6B35","#3BE8FF","#B8A0FF"].map(a => (
            <button key={a} onClick={() => setTweaks(t=>({...t,accentColor:a}))} style={{ width:28, height:28, borderRadius:"50%", background:a, border: tweaks.accentColor===a ? "2.5px solid #333" : "2px solid transparent", cursor:"pointer", outline:"none" }}/>
          ))}
        </div>
      </div>
    </div>
  );
}

// ─── APP ─────────────────────────────────────────────────────
function App() {
  const saved = (() => { try { return JSON.parse(localStorage.getItem("gymtonic-anno-tweaks")); } catch { return null; } })();
  const [tweaks, setTweaks] = React.useState({ ...TWEAK_DEFAULTS, ...saved });
  const [tweaksVisible, setTweaksVisible] = React.useState(false);

  React.useEffect(() => {
    localStorage.setItem("gymtonic-anno-tweaks", JSON.stringify(tweaks));
    window.parent.postMessage({ type:'__edit_mode_set_keys', edits: tweaks }, '*');
  }, [tweaks]);

  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type:'__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const t = THEMES[tweaks.theme] || THEMES.light;
  const accent = tweaks.accentColor;

  return (
    <div style={{ width:"100%", maxWidth:820, background:t.bg, borderRadius:8, overflow:"hidden", boxShadow:"0 24px 80px rgba(0,0,0,0.25)", minHeight:"80vh", transition:"background 0.3s" }}>
      <Nav t={t} accent={accent}/>
      <YearHero accent={accent}/>
      <div style={{ height:1, background:t.border }}/>
      <MonthlyChart t={t} accent={accent}/>
      <div style={{ height:1, background:t.border, margin:"20px 28px 0" }}/>
      <MonthlySummary t={t} accent={accent}/>
      <div style={{ height:1, background:t.border, margin:"8px 28px 0" }}/>
      <WorkoutList t={t} accent={accent}/>
      <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} visible={tweaksVisible}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
