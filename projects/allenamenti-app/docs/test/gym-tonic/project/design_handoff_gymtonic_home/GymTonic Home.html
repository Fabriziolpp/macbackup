<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GymTonic — Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }
  body { background: #e8e6e1; font-family: 'Barlow', sans-serif; display: flex; align-items: center; justify-content: center; }
  #root { width: 100%; display: flex; align-items: flex-start; justify-content: center; padding: 40px 20px; min-height: 100%; }
  
  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 2px; }

  @keyframes fillBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">


const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "showForm": false,
  "accentColor": "#FF3B6B"
}/*EDITMODE-END*/;

// ─── THEMES ──────────────────────────────────────────────────
const THEMES = {
  dark: {
    name: "Dark Athletic",
    bg: "#0D0D0D",
    surface: "#161616",
    card: "#1E1E1E",
    border: "rgba(255,255,255,0.08)",
    textPrimary: "#F0F0F0",
    textSecondary: "#888",
    textMuted: "#555",
    heroText: "#F0F0F0",
    formBg: "#1E1E1E",
    inputBg: "#121212",
    inputBorder: "rgba(255,255,255,0.1)",
    badgeText: "#0D0D0D",
    navBg: "#0D0D0D",
    navBorder: "rgba(255,255,255,0.08)",
    tagAprileBg: "#1a2a00",
    tagAprileColor: "#C8F135",
    tagMarzo: "#2a1a00",
    tagMarzoColor: "#FFA040",
    streakCard: "#1E1E1E"
  },
  light: {
    name: "Light Editorial",
    bg: "#F4F2EE",
    surface: "#FFFFFF",
    card: "#FFFFFF",
    border: "rgba(0,0,0,0.08)",
    textPrimary: "#111",
    textSecondary: "#666",
    textMuted: "#AAA",
    heroText: "#111",
    formBg: "#FFFFFF",
    inputBg: "#F4F2EE",
    inputBorder: "rgba(0,0,0,0.12)",
    badgeText: "#111",
    navBg: "#FFFFFF",
    navBorder: "rgba(0,0,0,0.08)",
    tagAprileBg: "#e8f7c0",
    tagAprileColor: "#4a7000",
    tagMarzo: "#ffe8cc",
    tagMarzoColor: "#a05000",
    streakCard: "#111"
  },
  split: {
    name: "Split Contrast",
    bg: "#F0EEE9",
    surface: "#FFFFFF",
    card: "#FFFFFF",
    border: "rgba(0,0,0,0.07)",
    textPrimary: "#111",
    textSecondary: "#666",
    textMuted: "#AAA",
    heroText: "#F0F0F0",
    formBg: "#FFFFFF",
    inputBg: "#F8F7F5",
    inputBorder: "rgba(0,0,0,0.1)",
    badgeText: "#0D0D0D",
    navBg: "#0D0D0D",
    navBorder: "rgba(255,255,255,0.08)",
    tagAprileBg: "#e8f7c0",
    tagAprileColor: "#4a7000",
    tagMarzo: "#ffe8cc",
    tagMarzoColor: "#a05000",
    streakCard: "#1E1E1E"
  }
};

const recentWorkouts = [
{ id: 1, month: "APR", scheda: "APRILE", giorno: "GIORNO 2", durata: 75, data: "19 aprile 2026", ora: "09:00", note: "saltati i giri finali", color: "#C8F135" },
{ id: 2, month: "APR", scheda: "APRILE", giorno: "GIORNO 3", durata: 60, data: "16 aprile 2026", ora: "08:15", note: "insieme a PT", color: "#C8F135" },
{ id: 3, month: "APR", scheda: "APRILE", giorno: "GIORNO 1", durata: 75, data: "14 aprile 2026", ora: "20:00", note: "solo 2 giri di ogni circuito", color: "#C8F135" },
{ id: 4, month: "MAR", scheda: "MARZO 2026", giorno: "PERSONAL TRAINER", durata: 92, data: "9 aprile 2026", ora: "08:00", note: "Chin-up 5×4, DIP enormi triple, stacchi fino a 90kg con nalzo, Panca Piana", color: "#FFA040" }];


// ─── NAV ─────────────────────────────────────────────────────
function Nav({ t, accent }) {
  const [active, setActive] = React.useState("Home");
  const links = ["Home", "Settimana", "Mese", "Anno", "Schede"];
  const isDark = t.navBg === "#0D0D0D";
  return (
    <nav style={{ background: t.navBg, borderBottom: `1px solid ${t.navBorder}`, padding: "0 28px", display: "flex", alignItems: "center", gap: 0, height: 52, position: "sticky", top: 0, zIndex: 20 }}>
      {/* Logo */}
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" style={{ marginRight: 24, flexShrink: 0 }}>
        <path d="M4 14 Q14 4 24 14 Q14 24 4 14Z" fill={accent} />
        <circle cx="14" cy="14" r="3" fill={isDark ? "#0D0D0D" : "#fff"} />
      </svg>
      <div style={{ display: "flex", gap: 4, flex: 1 }}>
        {links.map((l) =>
        <button key={l} onClick={() => setActive(l)} style={{
          background: "none", border: "none", cursor: "pointer",
          padding: "0 12px", height: 52, position: "relative",
          fontFamily: "'Barlow', sans-serif", fontSize: 14, fontWeight: 500,
          color: active === l ? isDark ? "#F0F0F0" : "#111" : t.textSecondary,
          letterSpacing: 0.2, transition: "color 0.15s"
        }}>
            {l}
            {active === l && <div style={{ position: "absolute", bottom: 0, left: 12, right: 12, height: 2, background: accent, borderRadius: 1 }} />}
          </button>
        )}
      </div>
      {/* Profile */}
      <div style={{ width: 32, height: 32, borderRadius: "50%", background: t.card, border: `1px solid ${t.border}`, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="6" r="3" stroke={t.textSecondary} strokeWidth="1.5" /><path d="M2 14c0-3.314 2.686-5 6-5s6 1.686 6 5" stroke={t.textSecondary} strokeWidth="1.5" strokeLinecap="round" /></svg>
      </div>
    </nav>);

}

// ─── HERO PROGRESS ───────────────────────────────────────────
function HeroProgress({ t, accent, isHeroDark }) {
  const [animated, setAnimated] = React.useState(false);
  const completed = 0,total = 5;
  React.useEffect(() => {const id = setTimeout(() => setAnimated(true), 100);return () => clearTimeout(id);}, []);

  const tc = isHeroDark ? "#F0F0F0" : t.heroText;
  const ts = isHeroDark ? "rgba(255,255,255,0.45)" : t.textSecondary;
  const bg = isHeroDark ? "#0D0D0D" : t.surface;
  const segBg = isHeroDark ? "rgba(255,255,255,0.1)" : "rgba(0,0,0,0.08)";

  return (
    <div style={{ background: bg, padding: "28px 28px 24px", animation: "fadeUp 0.4s ease" }}>
      {/* Row top */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
        <div>
          <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontSize: 11, fontWeight: 600, letterSpacing: 2, color: ts, textTransform: "uppercase" }}>
            Settimana 17 &nbsp;·&nbsp; 20 Apr – 28 Apr
          </div>
        </div>
        <div style={{ background: "rgba(255,70,70,0.12)", color: "#FF5555", fontFamily: "'Barlow Condensed', sans-serif", fontSize: 11, fontWeight: 700, letterSpacing: 1.5, padding: "3px 10px", borderRadius: 2, textTransform: "uppercase" }}>
          Sotto
        </div>
      </div>

      {/* Big number */}
      <div style={{ display: "flex", alignItems: "flex-end", gap: 4, marginBottom: 20 }}>
        <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 900, fontSize: 120, lineHeight: 0.85, color: tc, letterSpacing: -4 }}>
          {completed}
        </div>
        <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 700, fontSize: 48, color: ts, paddingBottom: 10 }}>
          /{total}
        </div>
        <div style={{ marginLeft: 16, paddingBottom: 14, display: "flex", flexDirection: "column", gap: 4 }}>
          <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontSize: 13, fontWeight: 600, color: ts, textTransform: "uppercase", letterSpacing: 1 }}>allenamenti</div>
          <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontSize: 13, fontWeight: 600, color: ts, textTransform: "uppercase", letterSpacing: 1 }}>questa settimana</div>
        </div>
      </div>

      {/* Progress segments */}
      <div style={{ display: "flex", gap: 4, marginBottom: 16 }}>
        {Array.from({ length: total }).map((_, i) =>
        <div key={i} style={{ flex: 1, height: 6, borderRadius: 2, background: segBg, overflow: "hidden", position: "relative" }}>
            {i < completed &&
          <div style={{
            position: "absolute", inset: 0, background: accent, transformOrigin: "left",
            animation: animated ? `fillBar 0.4s ease ${i * 0.08}s both` : "none"
          }} />
          }
          </div>
        )}
      </div>

      <div style={{ fontFamily: "'Barlow', sans-serif", fontSize: 12, color: ts, letterSpacing: 0.3 }}>
        La settimana è appena iniziata — {total} allenamenti sono l'obiettivo
      </div>
    </div>);

}

// ─── STREAK ──────────────────────────────────────────────────
function StreakSection({ t, accent, isHeroDark }) {
  const cardBg = isHeroDark ? t.streakCard : t.surface;
  const cardBorder = isHeroDark ? "rgba(255,255,255,0.06)" : t.border;
  const darkCard = t.streakCard === "#1E1E1E";

  return (
    <div style={{ padding: "20px 28px", display: "flex", gap: 12 }}>
      <div style={{ flex: 1, background: cardBg, border: `1px solid ${cardBorder}`, borderRadius: 6, padding: "16px 20px" }}>
        <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontSize: 10, fontWeight: 700, letterSpacing: 2, color: t.textMuted, textTransform: "uppercase", marginBottom: 6 }}>Streak</div>
        <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
          <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 800, fontSize: 38, color: darkCard ? "#F0F0F0" : t.textPrimary, letterSpacing: -1 }}>1</div>
          <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 600, fontSize: 16, color: darkCard ? "rgba(255,255,255,0.5)" : t.textSecondary, textTransform: "uppercase", letterSpacing: 1 }}>Settimana</div>
        </div>
      </div>
      <div style={{ flex: 1, background: accent, borderRadius: 6, padding: "16px 20px" }}>
        <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontSize: 10, fontWeight: 700, letterSpacing: 2, color: "rgba(0,0,0,0.45)", textTransform: "uppercase", marginBottom: 6 }}>Record</div>
        <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
          <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 800, fontSize: 38, color: "#0D0D0D", letterSpacing: -1 }}>2</div>
          <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 600, fontSize: 16, color: "rgba(0,0,0,0.5)", textTransform: "uppercase", letterSpacing: 1 }}>Settimane</div>
        </div>
      </div>
    </div>);

}

// ─── MOTIVATIONAL MSG ────────────────────────────────────────
function MotivationalMsg({ t, accent }) {
  return (
    <div style={{ margin: "0 28px 24px", padding: "18px 20px", background: t.card, border: `1px solid ${t.border}`, borderRadius: 6, borderLeft: `3px solid ${accent}`, animation: "fadeUp 0.5s ease 0.1s both" }}>
      <div style={{ fontSize: 14, lineHeight: 1.6, color: t.textSecondary, fontStyle: "italic", fontFamily: "Barlow" }}>
        Lunedì è il giorno giusto per ripartire! Questa settimana vai almeno per <strong style={{ color: t.textPrimary, fontStyle: "normal" }}>3 allenamenti</strong>: puoi battere il tuo record di 2 settimane consecutive.
      </div>
    </div>);

}

// ─── DIVIDER ─────────────────────────────────────────────────
function Divider({ t }) {
  return <div style={{ height: 1, background: t.border, margin: "0 0" }} />;
}

// ─── REGISTRA FORM ───────────────────────────────────────────
function RegistraForm({ t, accent, showForm }) {
  const [scheda, setScheda] = React.useState("");
  const [durata, setDurata] = React.useState("60");
  const [note, setNote] = React.useState("");
  const [saved, setSaved] = React.useState(false);
  const [open, setOpen] = React.useState(showForm);

  React.useEffect(() => {setOpen(showForm);}, [showForm]);

  const inputStyle = {
    width: "100%", padding: "11px 14px", fontFamily: "'Barlow', sans-serif", fontSize: 14,
    background: t.inputBg, border: `1px solid ${t.inputBorder}`, borderRadius: 4,
    color: t.textPrimary, outline: "none", transition: "border-color 0.15s",
    WebkitAppearance: "none", appearance: "none"
  };
  const labelStyle = { fontFamily: "'Barlow Condensed', sans-serif", fontSize: 11, fontWeight: 700, letterSpacing: 1.5, color: t.textMuted, textTransform: "uppercase", display: "block", marginBottom: 6 };

  const handleSave = () => {
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  return (
    <div style={{ animation: "fadeUp 0.5s ease 0.15s both" }}>
      <div style={{ padding: "24px 28px 0", display: "flex", alignItems: "center", justifyContent: "space-between", cursor: "pointer" }} onClick={() => setOpen((o) => !o)}>
        <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 800, fontSize: 36, letterSpacing: -1, color: t.textPrimary }}>
          REGISTRA
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, color: t.textSecondary }}>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" style={{ transform: open ? "rotate(180deg)" : "none", transition: "0.2s" }}>
            <path d="M4 7l5 5 5-5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
          </svg>
        </div>
      </div>

      {open &&
      <div style={{ padding: "20px 28px 28px" }}>
          {/* Date + Time row */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 16 }}>
            <div>
              <label style={labelStyle}>Data</label>
              <input type="date" defaultValue="2026-04-20" style={inputStyle} />
            </div>
            <div>
              <label style={labelStyle}>Ora</label>
              <input type="time" defaultValue="10:12" style={inputStyle} />
            </div>
          </div>

          {/* Scheda */}
          <div style={{ marginBottom: 16 }}>
            <label style={labelStyle}>Scheda</label>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {["APRILE", "MARZO 2026", "PERSONAL TRAINER"].map((s) =>
            <button key={s} onClick={() => setScheda(s)} style={{
              padding: "8px 16px", borderRadius: 4, cursor: "pointer", transition: "all 0.15s",
              fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 600, fontSize: 13, letterSpacing: 0.5,
              border: scheda === s ? `1.5px solid ${accent}` : `1.5px solid ${t.inputBorder}`,
              background: scheda === s ? accent : t.inputBg,
              color: scheda === s ? "#0D0D0D" : t.textSecondary
            }}>
                  {s}
                </button>
            )}
            </div>
          </div>

          {/* Tipo — appears only when scheda is picked */}
          {scheda &&
        <div style={{ marginBottom: 16 }}>
              <label style={labelStyle}>Tipo</label>
              <div style={{ display: "flex", gap: 8 }}>
                {["GIORNO 1", "GIORNO 2", "GIORNO 3"].map((g) =>
            <button key={g} style={{
              padding: "8px 14px", borderRadius: 4, cursor: "pointer",
              fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 600, fontSize: 13, letterSpacing: 0.5,
              border: `1.5px solid ${t.inputBorder}`, background: t.inputBg, color: t.textSecondary
            }}>{g}</button>
            )}
              </div>
            </div>
        }

          {/* Durata + Note */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 2fr", gap: 12, marginBottom: 20 }}>
            <div>
              <label style={labelStyle}>Durata (min)</label>
              <input type="number" value={durata} onChange={(e) => setDurata(e.target.value)} style={inputStyle} min="10" max="300" step="5" />
            </div>
            <div>
              <label style={labelStyle}>Note</label>
              <input type="text" value={note} onChange={(e) => setNote(e.target.value)} placeholder="Facoltativo" style={{ ...inputStyle, color: note ? t.textPrimary : t.textMuted }} />
            </div>
          </div>

          <button onClick={handleSave} style={{
          width: "100%", padding: "14px", fontFamily: "'Barlow Condensed', sans-serif",
          fontWeight: 800, fontSize: 16, letterSpacing: 2, textTransform: "uppercase",
          background: saved ? accent : t.textPrimary, color: saved ? "#0D0D0D" : t.bg,
          border: "none", borderRadius: 4, cursor: "pointer", transition: "all 0.2s"
        }}>
            {saved ? "✓ Salvato!" : "SALVA"}
          </button>
        </div>
      }
    </div>);

}

// ─── RECENTI ─────────────────────────────────────────────────
function Recenti({ t, accent }) {
  const [deleted, setDeleted] = React.useState([]);
  const visible = recentWorkouts.filter((w) => !deleted.includes(w.id));

  return (
    <div style={{ padding: "24px 28px 40px", animation: "fadeUp 0.5s ease 0.2s both" }}>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 20 }}>
        <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 800, fontSize: 36, letterSpacing: -1, color: t.textPrimary }}>RECENTI</div>
        <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontSize: 12, fontWeight: 600, letterSpacing: 1.5, color: t.textMuted, textTransform: "uppercase" }}>26 totali</div>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {visible.map((w, i) =>
        <WorkoutCard key={w.id} w={w} t={t} accent={accent} onDelete={() => setDeleted((d) => [...d, w.id])} idx={i} />
        )}
      </div>
    </div>);

}

function WorkoutCard({ w, t, accent, onDelete, idx }) {
  const [hover, setHover] = React.useState(false);
  const tagBg = w.month === "APR" ? t.tagAprileBg : t.tagMarzo;
  const tagColor = w.month === "APR" ? t.tagAprileColor : t.tagMarzoColor;

  return (
    <div
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        background: t.card,
        border: `1px solid ${hover ? w.color + "55" : t.border}`,
        borderRadius: 8,
        overflow: "hidden",
        display: "flex",
        transition: "all 0.18s",
        animation: `fadeUp 0.4s ease ${0.06 * idx}s both`,
        boxShadow: hover ? `0 4px 20px rgba(0,0,0,0.1)` : "none",
        transform: hover ? "translateY(-1px)" : "none",
      }}>

      {/* Accent stripe */}
      <div style={{ width: 4, flexShrink: 0, background: w.color }}/>

      {/* Content */}
      <div style={{ flex: 1, padding: "16px 18px", minWidth: 0 }}>
        {/* Top row: scheda tag + durata badge */}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <div style={{ background: tagBg, color: tagColor, fontFamily: "'Barlow Condensed', sans-serif", fontSize: 10, fontWeight: 700, letterSpacing: 1.5, padding: "3px 8px", borderRadius: 3, textTransform: "uppercase" }}>
              {w.scheda}
            </div>
            <span style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 700, fontSize: 16, letterSpacing: 0.5, color: t.textPrimary, textTransform: "uppercase" }}>{w.giorno}</span>
          </div>
          <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontSize: 13, fontWeight: 700, letterSpacing: 0.5, color: t.textMuted, background: t.inputBg, padding: "3px 10px", borderRadius: 3 }}>
            {w.durata} min
          </div>
        </div>

        {/* Date/time */}
        <div style={{ fontFamily: "'Barlow', sans-serif", fontSize: 12, color: t.textSecondary, marginBottom: w.note ? 8 : 0 }}>
          {w.data} · {w.ora}
        </div>

        {/* Note */}
        {w.note && (
          <div style={{ fontFamily: "'Barlow', sans-serif", fontSize: 13, color: t.textPrimary, fontStyle: "italic", lineHeight: 1.5, paddingTop: 4, borderTop: `1px solid ${t.border}` }}>
            "{w.note}"
          </div>
        )}
      </div>

      {/* Actions — slide in on hover */}
      <div style={{ flexShrink: 0, display: "flex", flexDirection: "column", justifyContent: "center", gap: 4, padding: "0 14px", borderLeft: `1px solid ${t.border}`, opacity: hover ? 1 : 0, transition: "opacity 0.15s" }}>
        <button style={{ background: "none", border: "none", cursor: "pointer", color: t.textSecondary, padding: 6, borderRadius: 4, display: "flex" }}>
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M10.5 1.5l3 3M2 13l1-4L11.5 1l3 3L6 13H2z" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/></svg>
        </button>
        <button onClick={onDelete} style={{ background: "none", border: "none", cursor: "pointer", color: "#FF5555", padding: 6, borderRadius: 4, display: "flex" }}>
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M3 4h9M6 4V2h3v2M5 4l.5 8M10 4l-.5 8" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/></svg>
        </button>
      </div>
    </div>);

}

// ─── TWEAKS PANEL ────────────────────────────────────────────
function TweaksPanel({ tweaks, setTweaks, visible }) {
  if (!visible) return null;
  const btnBase = { fontFamily: "'Barlow Condensed', sans-serif", fontSize: 13, fontWeight: 600, letterSpacing: 0.5, padding: "8px 14px", border: "1.5px solid #ddd", borderRadius: 4, cursor: "pointer", transition: "all 0.15s", background: "#fff", color: "#333" };
  const accents = ["#C8F135", "#FF6B35", "#3BE8FF", "#FF3B6B", "#B8A0FF"];
  return (
    <div style={{ position: "fixed", bottom: 24, right: 24, zIndex: 100, background: "#fff", border: "1px solid rgba(0,0,0,0.12)", borderRadius: 8, padding: "18px 20px", boxShadow: "0 8px 32px rgba(0,0,0,0.15)", width: 240 }}>
      <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 700, fontSize: 14, letterSpacing: 1, textTransform: "uppercase", color: "#333", marginBottom: 14 }}>Tweaks</div>
      
      <div style={{ marginBottom: 14 }}>
        <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: 1, color: "#999", textTransform: "uppercase", marginBottom: 8, fontFamily: "'Barlow Condensed', sans-serif" }}>Tema</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {Object.entries(THEMES).map(([key, th]) =>
          <button key={key} onClick={() => setTweaks((t) => ({ ...t, theme: key }))} style={{ ...btnBase, background: tweaks.theme === key ? "#0D0D0D" : "#fff", color: tweaks.theme === key ? "#fff" : "#333", borderColor: tweaks.theme === key ? "#0D0D0D" : "#ddd", textAlign: "left" }}>
              {th.name}
            </button>
          )}
        </div>
      </div>

      <div style={{ marginBottom: 14 }}>
        <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: 1, color: "#999", textTransform: "uppercase", marginBottom: 8, fontFamily: "'Barlow Condensed', sans-serif" }}>Accent</div>
        <div style={{ display: "flex", gap: 8 }}>
          {accents.map((a) =>
          <button key={a} onClick={() => setTweaks((t) => ({ ...t, accentColor: a }))} style={{ width: 28, height: 28, borderRadius: "50%", background: a, border: tweaks.accentColor === a ? "2.5px solid #333" : "2px solid transparent", cursor: "pointer", outline: "none" }} />
          )}
        </div>
      </div>

      <div>
        <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: 1, color: "#999", textTransform: "uppercase", marginBottom: 8, fontFamily: "'Barlow Condensed', sans-serif" }}>Form</div>
        <button onClick={() => setTweaks((t) => ({ ...t, showForm: !t.showForm }))} style={{ ...btnBase, background: tweaks.showForm ? "#0D0D0D" : "#fff", color: tweaks.showForm ? "#fff" : "#333", borderColor: tweaks.showForm ? "#0D0D0D" : "#ddd" }}>
          {tweaks.showForm ? "Form visibile" : "Form nascosto"}
        </button>
      </div>
    </div>);

}

// ─── APP ─────────────────────────────────────────────────────
function App() {
  const saved = (() => {try {return JSON.parse(localStorage.getItem("gymtonic-tweaks"));} catch {return null;}})();
  const [tweaks, setTweaks] = React.useState({ ...TWEAK_DEFAULTS, ...saved });
  const [tweaksVisible, setTweaksVisible] = React.useState(false);

  React.useEffect(() => {
    localStorage.setItem("gymtonic-tweaks", JSON.stringify(tweaks));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: tweaks }, '*');
  }, [tweaks]);

  // Register tweaks toggle listener
  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const t = THEMES[tweaks.theme] || THEMES.dark;
  const accent = tweaks.accentColor;
  const isHeroDark = tweaks.theme === "dark" || tweaks.theme === "split";

  return (
    <div style={{ width: "100%", maxWidth: 820, background: t.bg, borderRadius: 8, overflow: "hidden", boxShadow: "0 24px 80px rgba(0,0,0,0.25)", minHeight: "80vh", transition: "background 0.3s" }}>
      <Nav t={t} accent={accent} />
      <HeroProgress t={t} accent={accent} isHeroDark={isHeroDark} />
      <StreakSection t={t} accent={accent} isHeroDark={isHeroDark} />
      <MotivationalMsg t={t} accent={accent} />
      <Divider t={t} />
      <RegistraForm t={t} accent={accent} showForm={tweaks.showForm} />
      <Divider t={t} />
      <Recenti t={t} accent={accent} />
      <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} visible={tweaksVisible} />
    </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
